<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placement Portal · IIT Bombay — Interview Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --ink:#1a1a1a;
  --body:#636363;
  --mute:#80828d;
  --nav:#4a4a4a;
  --line:#e8eaf0;
  --soft:#f6f6f8;
  --teal:#43aec4;
  --teal-tint:rgba(104,204,229,.12);
  --teal-strong:#2d8ea1;
  --purple:#6457cf;
  --purple-tint:rgba(100,87,207,.10);
  --warn:#d9534f;
  --warn-tint:#fde8e8;
  --ok:#2f9e6e;
  --ok-tint:#e3f5ec;
  --accent:var(--teal);
  --accent-tint:var(--teal-tint);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d14;overflow:hidden;font-family:"DM Sans",system-ui,-apple-system,sans-serif;color:var(--ink);letter-spacing:-.023em}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--bg);padding:56px 72px 48px;opacity:0;visibility:hidden;transition:opacity .2s;overflow:hidden}
.slide.on{opacity:1;visibility:visible}
.slide.team{--accent:var(--purple);--accent-tint:var(--purple-tint)}
.kicker{font-size:14px;font-weight:500;color:var(--nav);display:flex;gap:10px;align-items:center}
.kicker .sq{width:9px;height:9px;background:var(--accent);border-radius:1px}
h1{font-family:"DM Sans";font-weight:500;font-size:40px;line-height:1.15;color:var(--accent);letter-spacing:-.023em;margin-top:14px;max-width:1050px}
h1.ink{color:var(--ink)}
h2{font-family:"DM Sans";font-weight:500;font-size:24px;line-height:1.2;color:var(--accent);letter-spacing:-.023em}
h3{font-family:"DM Sans";font-weight:500;font-size:16px;color:var(--ink)}
p.lead{font-size:20px;font-weight:300;line-height:1.3;color:var(--body);margin-top:16px;max-width:960px;letter-spacing:-.023em}
p.body{font-size:16px;font-weight:300;line-height:1.25;color:var(--body);letter-spacing:-.023em}
.small{font-size:14px;font-weight:300;color:var(--mute)}
.scn{display:grid;grid-template-columns:36px 1fr;gap:16px;margin-top:22px;max-width:1080px}
.scn .n{font-family:"DM Sans";font-size:34px;font-weight:300;color:var(--accent);line-height:1}
.scn .t{font-size:16px;font-weight:300;color:var(--body);line-height:1.3;max-width:900px}
.scn .t b{font-weight:500;color:var(--ink)}
.row{display:flex;gap:40px}
.col{flex:1;min-width:0}
.rowg{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:28px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.card.tint{background:var(--accent-tint);border-color:transparent}
ul.b{list-style:none;margin-top:14px}
ul.b li{position:relative;padding-left:22px;margin:11px 0;font-size:16px;font-weight:300;line-height:1.35;color:var(--body);letter-spacing:-.023em}
ul.b li b{font-weight:500;color:var(--ink)}
ul.b li::before{content:"";position:absolute;left:0;top:.5em;width:8px;height:8px;background:var(--accent);border-radius:1px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--accent-tint);color:var(--accent);font-weight:500;font-size:14px}
.chip.ok{background:var(--ok-tint);color:var(--ok)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.foot{position:absolute;left:72px;right:72px;bottom:18px;display:flex;justify-content:space-between;font-size:12px;font-weight:400;color:#aeb3c4}
.foot .p{color:var(--nav)}
.bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .2s}
.shot{position:relative;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px rgba(28,32,48,.08)}
.shot img{display:block;width:100%;height:auto}
.shot.dim img{filter:saturate(.5) brightness(.95)}
.tag{position:absolute;top:10px;left:10px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500;background:#1a1a1a;color:#fff;z-index:3}
.tag.v2{background:var(--accent)}
.tag.now{background:var(--warn);color:#fff}
.pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--warn);color:#fff;font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(217,83,79,.22);z-index:2;animation:pulse 2s infinite;font-family:"DM Sans"}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(217,83,79,.08)}}
.issues{list-style:none}
.issues li{display:flex;gap:14px;margin-bottom:16px}
.issues .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--warn);color:#fff;font-weight:500;display:flex;align-items:center;justify-content:center;margin-top:2px;font-size:13px}
.issues h3{font-size:16px;font-weight:500;color:var(--ink);line-height:1.2}
.issues p{font-size:14px;font-weight:300;color:var(--body);line-height:1.3;margin-top:3px}
.issues .ev{display:inline-block;margin-top:6px;font-size:12px;font-weight:500;color:var(--warn);background:var(--warn-tint);padding:3px 10px;border-radius:999px}
.thumbs{display:flex;gap:8px;margin-top:12px}
.thumb{width:72px;border-radius:6px;overflow:hidden;border:2px solid transparent;cursor:pointer;opacity:.55;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.thumb.sel{border-color:var(--accent);opacity:1}
.thumb img{display:block;width:100%}
.cap{margin-top:12px;font-size:14px;font-weight:300;color:var(--body);min-height:20px;letter-spacing:-.023em}
.cap b{font-weight:500;color:var(--ink)}
.phones{display:flex;gap:18px;align-items:flex-start;justify-content:center}
.phone{text-align:center;font-size:13px;color:var(--mute);font-weight:300}
.phone .shot{border-radius:22px;border:5px solid #1a1a1a;position:relative}
.phone .lbl{margin-top:10px;font-weight:500;color:var(--nav);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
.stat .big{font-family:"DM Sans";font-size:56px;font-weight:300;color:var(--accent);line-height:1;letter-spacing:-.04em}
.stat .sm{font-size:13px;font-weight:300;color:var(--body);margin-top:8px;line-height:1.3}
.steps{display:flex;gap:8px;margin-top:36px}
.step{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px 16px}
.step .no{font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.14em;text-transform:uppercase}
.step h3{font-size:14px;font-weight:500;margin-top:6px;color:var(--ink)}
.step p{font-size:12.5px;color:var(--body);margin-top:6px;line-height:1.3;font-weight:300}
.cmp{margin-top:20px;max-width:1080px}
.cmp .r{display:grid;grid-template-columns:230px 1fr 100px;gap:14px;align-items:center;margin:12px 0}
.cmp .lab{font-size:15px;font-weight:500;color:var(--ink)}
.cmp .tr{height:22px;position:relative;background:var(--soft);border-radius:4px;overflow:hidden}
.cmp .b1,.cmp .b2{height:11px;display:flex;align-items:center;padding-left:8px;font-size:10px;color:#fff;font-weight:500;white-space:nowrap}
.cmp .b1{background:#b5b9c6}
.cmp .b2{background:var(--accent)}
.cmp .d{font-weight:500;color:var(--ok);text-align:right;font-size:15px}
.legend{display:flex;gap:18px;font-size:12px;color:var(--mute);margin-top:8px;font-weight:300}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.divider{background:var(--bg)}
.divider .big-ink{font-family:"DM Sans";font-weight:500;font-size:64px;line-height:1.04;letter-spacing:-.03em;color:var(--ink);margin-top:18px;max-width:1050px}
.divider .big-ink em{color:var(--accent);font-style:normal}
.hmw{margin-top:30px;font-size:22px;font-weight:300;line-height:1.35;padding:28px 32px;border-radius:14px;background:var(--accent-tint);max-width:1050px;color:var(--ink);letter-spacing:-.023em}
.hmw b{font-weight:500;color:var(--accent)}
.now-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.now-tile{position:relative;max-height:250px;display:flex;flex-direction:column}
.now-tile .shot{border-radius:12px;border:4px solid #1a1a1a;height:200px}
.now-tile .shot img{height:100%;width:auto;object-fit:cover;object-position:top}
.now-tile .lab{margin-top:8px;font-size:11px;font-weight:300;color:var(--body);line-height:1.25}
.now-tile .lab b{display:block;font-weight:500;color:var(--ink);font-size:12px}
.tools{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.tool{padding:8px 16px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:300;color:var(--nav);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px}
.tool b{font-weight:500;color:var(--ink)}
.tool .d{width:8px;height:8px;border-radius:50%;background:var(--warn)}
#notes{position:fixed;left:0;right:0;bottom:0;background:#0b0d14;color:#e6e8f0;padding:14px 28px;font-size:15px;line-height:1.5;display:none;height:150px;overflow:auto;border-top:1px solid #2a2f40;z-index:50;font-weight:300}
body.notes #notes{display:block}
#help{position:fixed;right:14px;top:10px;font-size:11px;color:#6b7390;z-index:60;font-weight:300}
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{overflow:visible;background:#fff}
  #viewport{position:static;display:block}
  #stage{transform:none!important;height:auto}
  .slide{position:relative;opacity:1;visibility:visible;page-break-after:always;height:720px}
  #notes,#help,.bar{display:none!important}
}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="notes"></div>
<div id="help">← → navigate · N notes · F fullscreen</div>

<script>
const NAME = "Manasi Madan";
const ROLE = "UX research · design · front-end";
const A = "../public/assets/";

const img = (p, cls="") => `<img src="${p.startsWith('current/')?p:A+p}" alt="" ${cls}>`;
const pins = (arr=[]) => arr.map(p => `<div class="pin" style="left:${p.x}%;top:${p.y}%">${p.n}</div>`).join("");
const gallery = (items, tag, tagCls="", w=580) => { w = items.length>1 ? Math.min(w,560) : w; return `
  <div data-g>
    <div class="shot" style="width:${w}px">
      <span class="tag ${tagCls}">${tag}</span>
      ${img(items[0].src,'data-main')}
    </div>
    ${items.length>1?`<div class="thumbs">${items.map((it,i)=>`<div class="thumb ${i?'':'sel'}" data-src="${(it.src.startsWith('current/')?it.src:A+it.src)}" data-cap="${it.cap.replace(/"/g,'&quot;')}">${img(it.src)}</div>`).join("")}</div>`:""}
    <div class="cap" data-cap>${items[0].cap}</div>
  </div>`; };
const bullets = a => `<ul class="b">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const scn = (num, who, txt) => `<div class="scn"><div class="n">${num}.</div><div class="t"><b>${who}</b> ${txt}</div></div>`;

const T = {
  title: s => `
    <div class="kicker"><span class="sq"></span>Case study · IIT Bombay</div>
    <div style="display:flex;gap:60px;align-items:center;height:560px">
      <div style="flex:1">
        <div style="font-family:'DM Sans';font-weight:500;font-size:68px;line-height:1.04;letter-spacing:-.03em;color:var(--ink)">Placement Portal<br><span style="color:var(--teal)">from resume to offer.</span></div>
        <p class="lead" style="margin-top:28px;max-width:720px">A redesign of the IIT Bombay placement portal for the two groups who live and run the drive — <b style="color:var(--ink);font-weight:500">students</b> and the <b style="color:var(--ink);font-weight:500">placement team</b>.</p>
        <p class="body" style="margin-top:24px;color:var(--mute)">${NAME} · ${ROLE}</p>
      </div>
      <div style="width:220px">${img('f1/ipt-logo.png','style="width:220px"')}</div>
    </div>`,

  why: s => `
    <div class="kicker"><span class="sq"></span>Why this topic</div>
    <h1 class="ink">I was on the placement team last year.<br>I faced these issues first-hand.</h1>
    <div class="row" style="margin-top:34px">
      <div class="col card tint">
        <h2 style="color:var(--teal-strong)">What I lived</h2>
        ${bullets([
          "Knowledge transfer happened over <b>phone calls</b>",
          "Company contacts scraped from <b>old emails</b> into Excel",
          "Resumes verified by hand — <b>PDF vs. every pointer</b>",
          "Status in <b>WhatsApp, Excel, Google Chat and Gmail</b>"])}
      </div>
      <div class="col card">
        <h2>Why it had to be researched</h2>
        ${bullets([
          "My experience is one data point, not evidence",
          "The team has <b>many roles</b> — I saw one",
          "<b>Students</b> see a different side entirely",
          "I needed both perspectives before designing"])}
      </div>
    </div>`,

  system: s => `
    <div class="kicker"><span class="sq"></span>The system</div>
    <h1>IITs run one of India's largest placement drives — and the portal holds both sides back.</h1>
    <div class="row" style="margin-top:28px;align-items:center">
      <div style="width:460px">${img('f2/image3.png','style="width:460px"')}</div>
      <div class="col">
        <h3 style="font-size:18px;margin-bottom:12px;color:var(--teal)">Three counterparts of one engine</h3>
        ${bullets([
          "<b>Students</b> — a missed update can mean a lost opportunity",
          "<b>Placement team</b> — coordinators and faculty running the drive",
          "<b>Hiring managers</b> — the companies on the other side"])}
        <p class="body" style="margin-top:18px">Today's focus: <b style="color:var(--ink);font-weight:500">students and the team</b>.</p>
      </div>
    </div>`,

  currentIntro: s => `
    <div class="kicker"><span class="sq"></span>Current scenario</div>
    <h1 class="ink">This is how the portal runs <span style="color:var(--teal)">right now.</span></h1>
    <p class="lead">The screens on the next slide are the actual <b style="color:var(--ink);font-weight:500">placements.iitb.ac.in</b> portal in use this season — plus the WhatsApp group where most day-to-day coordination still happens.</p>
    <div class="tools">
      <span class="tool"><span class="d"></span><b>placements.iitb.ac.in</b> · portal</span>
      <span class="tool"><span class="d"></span><b>WhatsApp</b> · updates &amp; announcements</span>
      <span class="tool"><span class="d"></span><b>Blog</b> · shortlists</span>
      <span class="tool"><span class="d"></span><b>Google Chat</b> · coordinator notes</span>
      <span class="tool"><span class="d"></span><b>Excel</b> · company tracking</span>
      <span class="tool"><span class="d"></span><b>Gmail</b> · outreach</span>
    </div>
    <p class="small" style="margin-top:28px;max-width:900px">A student doesn't open one place to apply and track. They open five.</p>`,

  currentGrid: s => `
    <div class="kicker"><span class="sq"></span>Current scenario · the real portal</div>
    <h1 style="font-size:34px">Six surfaces for one application.</h1>
    <p class="small" style="margin-top:8px;max-width:800px">placements.iitb.ac.in in use this season — plus the WhatsApp group where day-to-day coordination still happens.</p>
    <div class="now-grid">
      <div class="now-tile"><div class="shot"><span class="tag now">LIVE</span>${img('current/6-landing.jpg')}</div><div class="lab"><b>Landing</b>Four role buttons</div></div>
      <div class="now-tile"><div class="shot"><span class="tag now">LIVE</span>${img('current/5-home.jpg')}</div><div class="lab"><b>Home</b>Payment status is the hero</div></div>
      <div class="now-tile"><div class="shot"><span class="tag now">LIVE</span>${img('current/4-resumes.jpg')}</div><div class="lab"><b>Resumes</b>Guidelines in a PDF modal</div></div>
      <div class="now-tile"><div class="shot"><span class="tag now">LIVE</span>${img('current/3-jobs-list.jpg')}</div><div class="lab"><b>Jobs</b>Dense list, Eligible chips</div></div>
      <div class="now-tile"><div class="shot"><span class="tag now">LIVE</span>${img('current/2-view-job.jpg')}</div><div class="lab"><b>Sign JAF</b>Long modal + resume + SOP</div></div>
      <div class="now-tile"><div class="shot"><span class="tag now">LIVE</span>${img('current/1-my-applications.jpg')}</div><div class="lab"><b>Applied</b>Flat linear progress per company</div></div>
      <div class="now-tile"><div class="shot"><span class="tag now">LIVE</span>${img('current/8-whatsapp.jpg')}</div><div class="lab"><b>WhatsApp group</b>"React if issue resolved"</div></div>
      <div class="now-tile"><div class="shot"><span class="tag now">LIVE</span>${img('current/7-google.jpg')}</div><div class="lab"><b>Google</b>How you find the portal URL</div></div>
    </div>`,

  currentTake: s => `
    <div class="kicker"><span class="sq"></span>Current scenario · what this means</div>
    <h1 class="ink">What the current portal leaves un-done.</h1>
    <div class="rowg" style="--c:3;margin-top:30px">
      <div class="card">
        <h3 style="color:var(--teal);font-size:14px;font-weight:500;letter-spacing:.12em;text-transform:uppercase">Students</h3>
        <ul class="b" style="margin-top:12px">
          <li>Verification guidelines open as a <b>separate PDF modal</b></li>
          <li>Jobs list is text-dense — you <b>can't scan</b> stipend or rounds</li>
          <li>Status is a <b>flat line of dots</b>, same per company</li>
          <li>Updates arrive through <b>WhatsApp</b>, not the portal</li>
        </ul>
      </div>
      <div class="card">
        <h3 style="color:var(--teal);font-size:14px;font-weight:500;letter-spacing:.12em;text-transform:uppercase">Team</h3>
        <ul class="b" style="margin-top:12px">
          <li>Companies tracked in a <b>shared Excel</b>, not the portal</li>
          <li>Announcements on WhatsApp — <b>"react if resolved"</b></li>
          <li>Verifiers log into a <b>separate role</b> to tick pointers</li>
          <li>No place to store <b>conversation history</b> with a company</li>
        </ul>
      </div>
      <div class="card tint">
        <h3 style="color:var(--teal-strong);font-size:14px;font-weight:500;letter-spacing:.12em;text-transform:uppercase">So</h3>
        <ul class="b" style="margin-top:12px">
          <li>Four role buttons isn't the answer — the <b>workflow</b> is</li>
          <li>The redesign must <b>absorb WhatsApp &amp; Excel</b> back into the portal</li>
          <li>Status needs to answer: <b>where am I right now?</b></li>
        </ul>
      </div>
    </div>`,

  approach: s => `
    <div class="kicker"><span class="sq"></span>How I worked</div>
    <h1>Same loop for both sides: research → scenario → prototype → test.</h1>
    <div class="steps">
      ${[["01","Survey","Quantify goals &amp; pain points"],
         ["02","Deep-dive","Contextual inquiry (team)"],
         ["03","Scenario","Find the key moments"],
         ["04","HMW + personas","Capture the problem"],
         ["05","AI prototypes","Test ideas quickly"],
         ["06","V1 → test","Task-based sessions"],
         ["07","V2 + experts","Fix &amp; validate"]]
       .map(x=>`<div class="step"><div class="no">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}
    </div>
    <p class="lead" style="margin-top:34px">Two scenarios per group. Each one runs <b style="color:var(--ink);font-weight:500">V1 → what broke → final</b>.</p>`,

  divider: s => `
    <div class="kicker"><span class="sq"></span>${s.k}</div>
    <div class="big-ink">${s.title}</div>
    ${s.lead?`<p class="lead" style="margin-top:22px">${s.lead}</p>`:""}
    ${s.hmw?`<div class="hmw"><b>How might we</b> ${s.hmw}</div>`:""}`,

  stats: s => `
    <div class="kicker"><span class="sq"></span>${s.k}</div>
    <h1>${s.title}</h1>
    ${s.lead?`<p class="lead">${s.lead}</p>`:""}
    <div class="stats" style="grid-template-columns:repeat(${s.items.length>4?4:s.items.length},1fr)">
      ${s.items.map(i=>`<div class="stat"><div class="big">${i[0]}</div><div class="sm">${i[1]}</div></div>`).join("")}
    </div>`,

  picks: s => `
    <div class="kicker"><span class="sq"></span>${s.k}</div>
    <h1>${s.title}</h1>
    <div class="rowg" style="--c:2;margin-top:34px">
      ${s.items.map((i,n)=>`<div class="card tint"><div class="small" style="font-weight:500;color:var(--accent);letter-spacing:.14em;text-transform:uppercase">Scenario ${n+1}</div><h2 style="margin-top:6px;color:var(--ink)">${i[0]}</h2><p class="body" style="margin-top:12px;font-size:16px">${i[1]}</p></div>`).join("")}
    </div>`,

  v1: s => `
    <div class="kicker"><span class="sq"></span>${s.k}</div>
    <h1>${s.title}</h1>
    ${scn("1", s.who, s.scn)}
    <div class="row" style="margin-top:22px">
      <div style="width:${s.w||560}px">${gallery(s.items,"V1","",s.w||560)}</div>

const stage = document.getElementById("stage");
const notesEl = document.getElementById("notes");
D.forEach((s, i) => {
  const el = document.createElement("section");
  const isDiv = s.type === "divider";
  el.className = `slide ${s.theme} ${isDiv?'divider':''}`;
  el.innerHTML = T[s.type](s.data) +
    `<div class="foot"><span class="p">Placement Portal · IIT Bombay</span><span>${i+1} / ${D.length}</span></div><div class="bar" style="width:${((i+1)/D.length)*100}%"></div>`;
  stage.appendChild(el);
});
const slides = [...stage.children];
let cur = 0;
function go(n){
  cur = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,i)=>s.classList.toggle("on", i===cur));
  notesEl.textContent = D[cur].notes || "";
  history.replaceState(null,"","#"+(cur+1));
}
function fit(){
  const h = innerHeight - (document.body.classList.contains("notes") ? 150 : 0);
  const sc = Math.min(innerWidth/1280, h/720);
  stage.style.transform = `scale(${sc})`;
  document.getElementById("viewport").style.bottom = document.body.classList.contains("notes") ? "150px" : "0";
}
addEventListener("resize", fit);
addEventListener("keydown", e => {
  if (["ArrowRight","PageDown"," "].includes(e.key)) { e.preventDefault(); go(cur+1); }
  else if (["ArrowLeft","PageUp"].includes(e.key)) { e.preventDefault(); go(cur-1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(slides.length-1);
  else if (e.key.toLowerCase() === "n") { document.body.classList.toggle("notes"); fit(); }
  else if (e.key.toLowerCase() === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }
});
document.addEventListener("click", e => {
  const th = e.target.closest(".thumb");
  if (th) {
    const g = th.closest("[data-g]");
    g.querySelector("[data-main]").src = th.dataset.src;
    g.querySelector("[data-cap]").innerHTML = th.dataset.cap;
    g.querySelectorAll(".thumb").forEach(t=>t.classList.toggle("sel", t===th));
    return;
  }
  const r = innerWidth;
  if (e.clientX > r*0.8) go(cur+1); else if (e.clientX < r*0.12) go(cur-1);
});
fit();
go((parseInt(location.hash.slice(1))||1)-1);
